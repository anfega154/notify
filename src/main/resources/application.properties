spring.application.name=notify

# ===================================
# Configuración de la base de datos
# ===================================

spring.datasource.url=jdbc:postgresql://localhost:5432/notify
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# Configuración de JPA/Hibernate
# ===================================

# Actualizar o crear las tablas automáticamente (update, validate, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true

# Dialecto específico para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Formatear las consultas SQL en la consola
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# Configuración del servidor
# ===================================

# Puerto del servidor (opcional)
server.port=8080

# ===================================
# Configuración de WebSocket
# ===================================

# Prefijo para el broker de mensajes
spring.websocket.application-destination-prefix=/app
# Prefijo para enviar mensajes a los clientes
spring.websocket.broker-destination-prefix=/topic